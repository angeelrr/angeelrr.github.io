<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" type="text/css" href="../../styles/login.css">
</head>
<body>

<div class="login-container">
  <h2>Inicio de sesión</h2>
  <form id="login-form" action="">
    <div class="form-group">
      <input type="text" id="username" class="login-input" placeholder="Usuario o email" autocomplete="username">
      <input type="password" id="password" class="login-input" placeholder="Contraseña" autocomplete="password">
    </div>
    <button type="submit" class="login-button">Inicia sesión</button>
    <p id="error-message" style="color: #34495e; display: none;">Credenciales invalidas. Porfavor, intentelo de nuevo.</p>
    <div class="additional-options">
      <label class="remember-me-label">
        <input type="checkbox" class="remember-me-checkbox"> Recuerdame
      </label>
      <a class="forgot-password-link" href="">Olvidaste tu contraseña?</a>
    </div>
  </form>
  <p class="registration-message">No tienes una cuenta? <a class="registration-link" href="../../registration/registration.html">Registrate</a></p>
</div>

  <script defer src="../../scripts/index.js"></script>
  
</body>
</html>
