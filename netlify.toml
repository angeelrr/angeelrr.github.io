[build]
publish = "."  # Ensure this is pointing to your root folder

[[redirects]]
from = "/"
to = "/login/"
status = 200

[[redirects]]
from = "/dashboard"
to = "/dashboard/dashboard.html"
status = 200

[[redirects]]
from = "/registration"
to = "/registration/registration.html"
status = 200

[[redirects]]
from = "/es/*"
to = "/login/es/:splat"
status = 200

[[redirects]]
from = "/login/*"
to = "/login/index.html"
status = 200
