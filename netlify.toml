[[redirects]]
  from = "/"
  to = "/login/"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/dashboard.html"
  status = 200

[[redirects]]
  from = "/registration"
  to = "/registration/registration.html"
  status = 200

# Updated rule for Spanish language redirection
[[redirects]]
  from = "/login/es/*"
  to = "/login/es/:splat"
  status = 200
